
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nofal Fayyaz Warraich Profile</title>
    <style>
        /* General Page Styling */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e3f2fd; /* Light blue background to complement image */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Profile Card Container */
        .profile-card {
            background-color: #ffffff;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            width: 350px;
            overflow: hidden;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .profile-card:hover {
            transform: translateY(-5px);
        }

        /* Image Section */
        .profile-header {
            position: relative;
            background-color: #0d47a1; /* Dark blue from suit */
            height: 100px;
        }

        .profile-img-container {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 5px solid #ffffff;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            background-color: #ffffff; /* Fallback for slow loading */
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
        }

        /* Content Section */
        .profile-body {
            padding: 70px 25px 30px 25px;
        }

        .profile-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0d47a1;
            margin: 0 0 10px 0;
        }

        .profile-info {
            font-size: 0.95rem;
            color: #555555;
            margin: 0;
            line-height: 1.6;
        }

        .info-label {
            font-weight: 600;
            color: #333333;
        }

        /* Call to Action Button */
        .profile-btn {
            display: inline-block;
            background-color: #0d47a1;
            color: #ffffff;
            padding: 10px 25px;
            margin-top: 20px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background-color 0.3s ease;
        }

        .profile-btn:hover {
            background-color: #1565c0;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <!-- Blue Header Background -->
        <div class="profile-header"></div>
        
        <!-- Image in a Circular Frame -->
        <div class="profile-img-container">
            <img src="image_2ba1ce.jpg" alt="Profile picture of Nofal Fayyaz Warraich" class="profile-img">
        </div>

        <!-- Person Information -->
        <div class="profile-body">
            <h2 class="profile-name">Nofal Fayyaz Warraich</h2>
            <div class="profile-info">
                <p><span class="info-label">Nationality:</span> Pakistan</p>
                <p><span class="info-label">Age:</span> 16 Years</p>
            </div>
            <!-- Optional: Button/Link -->
            <a href="#" class="profile-btn">View Profile</a>
        </div>
    </div>

</body>
</html>
